<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04342C"/>
      <stop offset="50%" stop-color="#085041"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FE1CB"/>
      <stop offset="100%" stop-color="#3FBE93"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C4B3"/>
      <stop offset="100%" stop-color="#D85A30"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle plate / vision outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(159, 225, 203, 0.25)" stroke-width="8" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="150" fill="#042922" filter="url(#glow)"/>

  <!-- Segmented Food Plate Representation -->
  <!-- Segment 1: Protein (Coral) -->
  <path d="M256 256 L256 120 A136 136 0 0 1 380 200 Z" fill="url(#coralGrad)" opacity="0.95"/>
  <!-- Segment 2: Veggies (Teal) -->
  <path d="M256 256 L380 200 A136 136 0 0 1 300 385 Z" fill="url(#leafGrad)" opacity="0.95"/>
  <!-- Segment 3: Carbs (Amber) -->
  <path d="M256 256 L300 385 A136 136 0 0 1 130 310 Z" fill="#EF9F27" opacity="0.95"/>
  <!-- Segment 4: Healthy Fats / Broth (Soft Teal) -->
  <path d="M256 256 L130 310 A136 136 0 0 1 256 120 Z" fill="#9FE1CB" opacity="0.95"/>

  <!-- Center Core Lens / Vision AI Focus -->
  <circle cx="256" cy="256" r="68" fill="#04342C" stroke="#3FBE93" stroke-width="4"/>
  <circle cx="256" cy="256" r="48" fill="#085041"/>

  <!-- Brand Letter N (Fraunces style typography mark) -->
  <text x="256" y="278" text-anchor="middle" fill="#EAF6F1" font-family="'Georgia', serif" font-weight="bold" font-size="64" letter-spacing="-2">N</text>

  <!-- Camera / Scan crosshair accents -->
  <path d="M120 160 L120 120 L160 120" stroke="#3FBE93" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M392 160 L392 120 L352 120" stroke="#3FBE93" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M120 352 L120 392 L160 392" stroke="#3FBE93" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M392 352 L392 392 L352 392" stroke="#3FBE93" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
